# Ce fichier est un modèle : l'image nginx y remplace ${NGINX_LOCAL_RESOLVERS} au démarrage.
server {
  listen 80;
  # Résolution DNS à la demande : l'application démarre même hors ligne.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;

  # Worker PDF.js (.mjs) : doit être servi comme du JavaScript pour l'import de plans PDF
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fichiers versionnés par Vite : cache long
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Connecteurs de catalogues (configurés dans Administration) : relais vers les API,
  # sans quoi le navigateur bloquerait les appels (CORS). La clé est celle de l'utilisateur,
  # envoyée par le navigateur ; rien n'est appelé tant qu'elle n'est pas renseignée.
  location /connecteurs/apify/ {
    set $apify https://api.apify.com;
    rewrite ^/connecteurs/apify/(.*)$ /$1 break;
    proxy_pass $apify;
    proxy_ssl_server_name on;
    proxy_set_header Host api.apify.com;
    proxy_set_header Origin "";
    proxy_set_header Cookie "";
    proxy_read_timeout 300s;
  }
  location /connecteurs/writ/ {
    set $writ https://api.usewrit.app;
    rewrite ^/connecteurs/writ/(.*)$ /$1 break;
    proxy_pass $writ;
    proxy_ssl_server_name on;
    proxy_set_header Host api.usewrit.app;
    proxy_set_header Origin "";
    proxy_set_header Cookie "";
    proxy_read_timeout 120s;
  }

  # IA locale (Ollama, modèle de vision open source) : relais vers le service « ollama » de docker compose
  # (profil « ia ») ou vers l'adresse donnée dans OLLAMA_URL. Rien ne sort du réseau de l'utilisateur.
  # Sans Ollama derrière, le relais répond 502 et l'application continue sans IA.
  location /ia-locale/ {
    set $ollama ${OLLAMA_URL};
    rewrite ^/ia-locale/(.*)$ /$1 break;
    proxy_pass $ollama;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    # Même origine pour Ollama : pas besoin de régler OLLAMA_ORIGINS
    proxy_set_header Origin "";
    proxy_set_header Cookie "";
    # Images des plans en base64, réponses lentes sans carte graphique, progression du téléchargement du modèle
    client_max_body_size 64m;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
