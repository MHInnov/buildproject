server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;

  # Worker PDF.js (.mjs) : doit être servi comme du JavaScript pour l'import de plans PDF
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fichiers versionnés par Vite : cache long
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
