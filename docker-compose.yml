# Application et IA locale dans un seul conteneur : docker compose up --build
# puis ouvrir http://localhost:7080
#
# Avec une carte graphique NVIDIA (pilote + NVIDIA Container Toolkit), fortement conseillé pour l'IA :
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Sans carte graphique, l'application démarre sans IA (activable dans l'administration, en plus lent).
# Autre modèle : IA_MODELE=qwen2.5vl:3b docker compose up --build ; sans IA locale : IA_MODELE= docker compose up --build
services:
  app:
    build:
      context: .
      target: ia
    image: construprojet:ia
    ports:
      - "7080:80"
    environment:
      IA_MODELE: ${IA_MODELE-qwen2.5vl:7b}
    volumes:
      # Modèle téléchargé une seule fois, gardé entre deux lancements
      - construprojet-ia:/root/.ollama
    restart: unless-stopped

volumes:
  construprojet-ia:
