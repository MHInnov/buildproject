name: Image Docker

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vérifie que l'image démarre et sert l'application sur le port 7080
      - name: Test de démarrage
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 7080:80 "$IMAGE"
          for i in $(seq 1 20); do curl -fsS http://localhost:7080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:7080/ | grep -q '<div id="root">'
          docker exec smoke nginx -T | grep -q 'location /connecteurs/apify/'
          docker logs smoke
          docker rm -f smoke
